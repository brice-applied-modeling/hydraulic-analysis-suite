
[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydraulic-analysis-suite"
version = "0.1.0"
description = "Python-based hydraulic analysis and engineering decision-support tools for municipal water and wastewater infrastructure."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = [
    "hydraulics",
    "civil-engineering",
    "water",
    "wastewater",
    "force-main",
    "lift-station",
    "engineering-analysis",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=2.4.6",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.10.9",
    "pandas>=3.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "ipykernel>=6.29.3,<7",
    "ipython>=9.14.1",
    "jupyterlab>=4.5.8",
    "spyder-kernels>=3.1.0,<3.2.0",
]
